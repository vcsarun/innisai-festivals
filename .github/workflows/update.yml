name: Update festivals.json
on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U holidays
      - run: python build_festivals.py
      - name: Commit if changed
        run: |
          git config user.name "festival-bot"
          git config user.email "festival-bot@users.noreply.github.com"
          git add festivals.json
          git diff --cached --quiet || (git commit -m "Update festivals" && git push)
